<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>protfolio project</title>

<style>

    body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: black;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
    }

    h1 {
        color: rgb(253, 3, 3);
        font-size: 2rem;
        margin-bottom: 20px;
        text-align: center;
    }

    img {
        width: 300px;
        height: 300px;
        border-radius: 50%;
        margin-bottom: 20px;
        border: 5px solid rgb(251, 248, 248);
    }

    button {
        padding: 10px 20px;
        font-size: 1.2rem;
        background-color: rgb(253, 3, 3);
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

 
    @media (max-width: 900px) {

        h1 {
            font-size: 1.7rem;
        }

        img {
            width: 250px;
            height: 250px;
        }

        button {
            font-size: 1.1rem;
            padding: 10px 18px;
        }
    }


    @media (max-width: 600px) {

        body {
            padding: 15px;
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 15px;
        }

        img {
            width: 200px;
            height: 200px;
            border-width: 4px;
        }

        button {
            font-size: 1rem;
            padding: 10px 18px;
        }
    }

    @media (max-width: 400px) {

        h1 {
            font-size: 1.2rem;
        }

        img {
            width: 170px;
            height: 170px;
        }

        button {
            font-size: 0.9rem;
            padding: 9px 16px;
        }
    }

</style>


</head>

<body>

</a>


</body>

</html>
